services:
  bot:
    build: .
    environment:
      - TELEGRAM_BOT_TOKEN
      - OPENAI_API_KEY
      - DATABASE_URL
      - ALLOWED_CHAT_IDS
      - APP_ENV
      - LOG_LEVEL
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
