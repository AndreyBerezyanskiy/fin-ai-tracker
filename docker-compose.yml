services:
  bot:
    build: .
    environment:
      - TELEGRAM_BOT_TOKEN
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_TRANSCRIPTION_MODEL
      - DATABASE_URL
      - ALLOWED_CHAT_IDS
      - ADMIN_USER_IDS
      - APP_ENV
      - LOG_LEVEL
      - TELEGRAM_TIMEOUT_SECONDS
      - OPENAI_TIMEOUT_SECONDS
      - OPENAI_MAX_RETRIES
      - DATABASE_CONNECT_TIMEOUT_SECONDS
      - MAX_MESSAGE_LENGTH
      - AI_REQUESTS_PER_MINUTE
      - VOICE_INPUT_ENABLED
      - VOICE_REQUESTS_PER_MINUTE
      - MAX_VOICE_DURATION_SECONDS
      - MAX_VOICE_FILE_SIZE_BYTES
      - STORE_ORIGINAL_TEXT
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
